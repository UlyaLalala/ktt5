name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-timeout asgiref python-dotenv

      - name: Run tests
        run: |
          python -m pytest tests/

  build-and-run:
    name: Build and run Flaskr / Python 3.12
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: |
          python -m build
          ls -l dist/

      - name: Create venv and install built wheel
        run: |
          python -m venv .venv-app
          .venv-app/bin/python -m pip install --upgrade pip
          .venv-app/bin/python -m pip install dist/*.whl
          .venv-app/bin/python -m pip show Flask

      - name: Install Flaskr without replacing Flask from wheel
        run: |
          FLASK_VERSION_BEFORE=$(.venv-app/bin/python -c "import flask; print(flask.__version__)")

          .venv-app/bin/python -m pip install --no-deps ./examples/tutorial

          FLASK_VERSION_AFTER=$(.venv-app/bin/python -c "import flask; print(flask.__version__)")

          echo "Flask before: $FLASK_VERSION_BEFORE"
          echo "Flask after:  $FLASK_VERSION_AFTER"
          test "$FLASK_VERSION_BEFORE" = "$FLASK_VERSION_AFTER"

      - name: Init DB and run Flaskr on port 5000
        working-directory: examples/tutorial
        run: |
          export FLASK_APP=flaskr

          ../../.venv-app/bin/flask init-db

          ../../.venv-app/bin/flask run --host=127.0.0.1 --port=5000 &
          APP_PID=$!

          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/ > /dev/null; then
              echo "Flaskr is running on port 5000"
              exit 0
            fi
            sleep 1
          done

          echo "Flaskr did not start on port 5000" >&2
          exit 1